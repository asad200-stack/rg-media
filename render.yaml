databases:
  - name: rg-media-db
    databaseName: rg_media
    user: rg_media
    plan: free

services:
  - type: web
    name: rg-media-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rg-media-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_SEED
        value: "true"
      - key: WEB_ORIGIN
        value: https://rg-media-web.onrender.com

  - type: web
    name: rg-media-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: rg-media-api
          property: host
        transform: "https://${host}/api/v1"
